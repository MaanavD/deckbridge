name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 10
    env:
      DECKBRIDGE_TEST_TIMEOUT_SECONDS: "90"
      # Process adoption needs a real per-user launchd/HID session. The full
      # local release gate still runs this suite on an interactive Mac.
      DECKBRIDGE_TEST_EXCLUDE: "test_startup.sh"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Build the same venv used by the startup installer
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt pillow cairosvg
      - run: ./run_tests.sh
