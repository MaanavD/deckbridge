name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 10
    env:
      DECKBRIDGE_TEST_TIMEOUT_SECONDS: "90"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Build the same venv used by the startup installer
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt pillow cairosvg
      - run: ./run_tests.sh
